name: EARAM Tabs Android
run-name: EARAM Tabs Android — release validation #${{ github.run_number }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Require release signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KS"
          test -n "$KP"
          test -n "$AP"

      - name: Decode release keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/earam-release.keystore.p12"
          printf '%s' "$KS" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_PATH"
          openssl pkcs12 -in "$KEYSTORE_PATH" -passin "env:KP" -info -noout >/dev/null
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Clean repository build outputs
        run: |
          set -euo pipefail
          gradle clean --no-daemon --stacktrace
          rm -rf .gradle app/build core/build web/dist

      - name: Unit tests
        run: gradle :core:test --no-daemon --stacktrace

      - name: Build clean release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: earam_release
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle clean :app:assembleRelease -Pandroid.injected.build.api=36 -Pandroid.injected.testOnly=false --no-daemon --stacktrace

      - name: Select exactly one APK
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find "$GITHUB_WORKSPACE/app/build" -type f -name '*.apk' -print)
          test "${#APKS[@]}" -eq 1
          echo "APK_PATH=${APKS[0]}" >> "$GITHUB_ENV"
          stat -c 'APK size: %s bytes' "${APKS[0]}"

      - name: Normalize APK archive and release signature
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: earam_release
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          ALIGNED="$RUNNER_TEMP/earam-aligned.apk"
          SIGNED="$RUNNER_TEMP/earam-signed.apk"

          if unzip -Z1 "$APK_PATH" | grep -q '^assets/dexopt/'; then
            zip -d "$APK_PATH" 'assets/dexopt/*'
          fi

          "$ZIPALIGN" -f -P 16 4 "$APK_PATH" "$ALIGNED"
          "$SIGNER" sign --ks "$ANDROID_KEYSTORE_PATH" --ks-type PKCS12 --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass "env:ANDROID_KEY_PASSWORD" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$SIGNED" "$ALIGNED"
          mv "$SIGNED" "$APK_PATH"
          rm -f "$ALIGNED"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$SIGNER" verify --verbose --print-certs "$APK_PATH" | tee /tmp/apksigner.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apksigner.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/apksigner.txt
          grep -q "Signer #1 certificate DN: C=EG, O=EARAM, CN=EARAM Tabs Release" /tmp/apksigner.txt
          if grep -q "Android Debug" /tmp/apksigner.txt; then
            echo "ERROR: debug certificate detected"
            exit 1
          fi

      - name: Verify Android 15 installability requirements
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          BADGING="$("$AAPT2" dump badging "$APK_PATH")"
          printf '%s\n' "$BADGING"
          grep -q "package: name='com.earam.tabs'" <<< "$BADGING"
          VERSION_CODE="$(sed -n "s/.*versionCode='\\([0-9][0-9]*\\)'.*/\\1/p" <<< "$BADGING")"
          VERSION_NAME="$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" <<< "$BADGING")"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          test "$VERSION_CODE" -ge 100000
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          grep -q "versionName='$VERSION_NAME'" <<< "$BADGING"
          if grep -q "testOnly='true'" <<< "$BADGING"; then
            echo "ERROR: testOnly APK"
            exit 1
          fi
          if grep -q "debuggable='true'" <<< "$BADGING"; then
            echo "ERROR: debuggable APK"
            exit 1
          fi
          unzip -Z1 "$APK_PATH" | grep -q '^resources.arsc$'

          # AlphaTab ships its Skia native runtime. These libraries are expected.
          # Reject any other native library so accidental/unrelated native payloads
          # cannot be introduced later.
          mapfile -t NATIVE_LIBS < <(unzip -Z1 "$APK_PATH" | grep -E '^lib/[^/]+/[^/]+\.so$' || true)
          for lib in "${NATIVE_LIBS[@]}"; do
            case "$lib" in
              lib/arm64-v8a/libalphaskiajni.so|lib/armeabi-v7a/libalphaskiajni.so|lib/x86/libalphaskiajni.so|lib/x86_64/libalphaskiajni.so) ;;
              *) echo "ERROR: unexpected native library: $lib"; exit 1 ;;
            esac
          done
          test "${#NATIVE_LIBS[@]}" -eq 4

          if unzip -Z1 "$APK_PATH" | grep -E '^assets/dexopt/(baseline\.prof|baseline\.profm)$'; then
            echo "ERROR: baseline profile payload must not be shipped in this sideload APK"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK_PATH"
          unzip -t "$APK_PATH"

      - name: Install-test on clean Android 15 emulator
        timeout-minutes: 30
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
          ANDROID_EMULATOR_HOME: ${{ runner.temp }}/android-emulator
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_EMULATOR_HOME"
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd --force --name earam_api35 --package "system-images;android-35;google_apis;x86_64"
          adb start-server
          nohup "$ANDROID_HOME/emulator/emulator" -avd earam_api35 -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot-load -no-snapshot-save -wipe-data -accel on -gpu swiftshader_indirect >/tmp/earam-emulator.log 2>&1 &
          for _ in $(seq 1 180); do
            adb connect 127.0.0.1:5554 >/dev/null 2>&1 || true
            [ "$(adb -s emulator-5554 get-state 2>/dev/null || true)" = "device" ] && break
            sleep 2
          done
          [ "$(adb -s emulator-5554 get-state 2>/dev/null)" = "device" ]
          for _ in $(seq 1 300); do
            [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 2
          done
          [ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = "1" ]
          # Deterministic emulator state before install/launch.
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
          adb -s emulator-5554 shell getprop ro.build.version.sdk
          adb -s emulator-5554 install --no-incremental "$APK_PATH"
          adb -s emulator-5554 shell pm path com.earam.tabs
          adb -s emulator-5554 install -r --no-incremental "$APK_PATH"

      # Publish the exact signed APK before any non-critical runtime smoke test.
      # This guarantees the APK + checksum remain available even if smoke fails.
      - name: Generate APK SHA-256
        run: sha256sum "$APK_PATH" > "$APK_PATH.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Earam-APK-${{ github.run_number }}
          path: |
            ${{ env.APK_PATH }}
            ${{ env.APK_PATH }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Deterministic AlphaTab cursor screenshot test
        timeout-minutes: 3
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/earam-smoke"
          mkdir -p "$OUT"
          timeout 10s adb -s emulator-5554 logcat -c || true
          # Start a fresh Activity and pass the CI trigger as an explicit Intent extra.
          # -S is intentional: it guarantees the old Activity/process cannot consume
          # the launch without receiving the new extra.
          timeout 20s adb -s emulator-5554 shell am start -S -W -n com.earam.tabs/.MainActivity --ez earam_ci_cursor_test true > "$OUT/launch.log" 2>&1
          cat "$OUT/launch.log"
          # Never guess that AlphaTab is ready after N seconds. The application must
          # explicitly report fixture creation plus finite renderer-derived coordinates.
          READY=0
          for i in $(seq 1 45); do
            timeout 5s adb -s emulator-5554 logcat -d -v brief > "$OUT/wait.log" || true
            if grep -q "EARAM_CI_CURSOR.*CI cursor test READY" "$OUT/wait.log" &&
               grep -q "caretFinalPx=" "$OUT/wait.log" &&
               grep -q "playbackFinalPx=" "$OUT/wait.log"; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "CI cursor fixture did not become ready"
            echo "----- CI/CURSOR LOG -----"
            grep -E 'EARAM_CI_CURSOR|EARAM_COORD|EARAM_ALPHA_CURSOR|EARAM_SCROLL|FATAL|AndroidRuntime' "$OUT/wait.log" || true
            echo "----- ACTIVITY STATE -----"
            timeout 10s adb -s emulator-5554 shell dumpsys activity activities | grep -E 'mResumedActivity|MainActivity|com.earam.tabs' | tail -40 || true
            echo "----- PROCESS STATE -----"
            timeout 10s adb -s emulator-5554 shell pidof com.earam.tabs || true
            exit 1
          fi
          # Capture directly through adb exec-out. This avoids Android 15 shell
          # filesystem/path quirks around screencap + pull and gives the test the
          # PNG bytes directly on the runner.
          SCREENSHOT="$OUT/alphaTab-cursor-test.png"
          timeout 20s adb -s emulator-5554 exec-out screencap -p > "$SCREENSHOT"
          test -s "$SCREENSHOT"
          python3 - "$SCREENSHOT" <<'PY'
          import struct
          import sys
          path = sys.argv[1]
          with open(path, "rb") as f:
              if f.read(8) != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit("invalid PNG signature")
              length = struct.unpack(">I", f.read(4))[0]
              chunk = f.read(4)
              if chunk != b"IHDR" or length != 13:
                  raise SystemExit("invalid PNG IHDR")
              width, height = struct.unpack(">II", f.read(8))
          print(f"screenshot: {width}x{height}")
          if width < 200 or height < 200:
              raise SystemExit("invalid screenshot")
          PY
          timeout 15s adb -s emulator-5554 logcat -d -v threadtime > "$OUT/full.log" || true
          grep -E 'EARAM_ALPHA_CURSOR|EARAM_COORD|EARAM_SCROLL|EARAM_CI_CURSOR|FATAL|AndroidRuntime' "$OUT/full.log" > "$OUT/filtered.log" || true
          test -s "$OUT/alphaTab-cursor-test.png"

          # A valid PNG is not a cursor test. Require the app to report finite,
          # renderer-derived caret/playback coordinates from the exact AlphaTab
          # boundsLookup used for the selected beat. This prevents a green CI
          # result when the screenshot merely exists.
          python3 - "$OUT/full.log" <<'PY'
          import re, sys, math
          log = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          if "EARAM_COORD" not in log:
              raise SystemExit("cursor test failed: no EARAM_COORD diagnostics")
          caret = re.findall(r"caretFinalPx=([-+0-9.eE]+),([-+0-9.eE]+)", log)
          playback = re.findall(r"playbackFinalPx=([-+0-9.eE]+),([-+0-9.eE]+)", log)
          if not caret:
              raise SystemExit("cursor test failed: no caretFinalPx")
          if not playback:
              raise SystemExit("cursor test failed: no playbackFinalPx")
          def finite(pair):
              return all(math.isfinite(float(x)) for x in pair)
          if not finite(caret[-1]) or not finite(playback[-1]):
              raise SystemExit("cursor test failed: non-finite cursor coordinates")
          print("caretFinalPx=", caret[-1])
          print("playbackFinalPx=", playback[-1])
          PY

          # The visual caret is intentionally yellow/orange. Inspect actual PNG
          # pixels instead of accepting screenshot dimensions as proof. We use
          # broad thresholds rather than one exact RGB value so emulator
          # rendering/anti-aliasing does not create false negatives.
          python3 - "$OUT/alphaTab-cursor-test.png" <<'PY'
          import struct, zlib, sys
          p=sys.argv[1]
          data=open(p,"rb").read()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("invalid PNG signature")
          pos=8; idat=b""; w=h=ct=bd=None
          while pos < len(data):
              n=struct.unpack(">I",data[pos:pos+4])[0]; typ=data[pos+4:pos+8]
              chunk=data[pos+8:pos+8+n]; pos += 12+n
              if typ==b"IHDR":
                  w,h,bd,ct,_,_,_=struct.unpack(">IIBBBBB",chunk)
              elif typ==b"IDAT": idat += chunk
              elif typ==b"IEND": break
          if ct != 6 or bd != 8:
              raise SystemExit(f"unsupported PNG format color_type={ct} bit_depth={bd}")
          raw=zlib.decompress(idat)
          bpp=4; stride=w*bpp; rows=[]; prev=bytearray(stride); i=0
          def paeth(a,b,c):
              p=a+b-c; pa=abs(p-a); pb=abs(p-b); pc=abs(p-c)
              return a if pa<=pb and pa<=pc else b if pb<=pc else c
          for y in range(h):
              f=raw[i]; i+=1; cur=bytearray(raw[i:i+stride]); i+=stride
              for x in range(stride):
                  a=cur[x-bpp] if x>=bpp else 0
                  b=prev[x]; c=prev[x-bpp] if x>=bpp else 0
                  if f==1: cur[x]=(cur[x]+a)&255
                  elif f==2: cur[x]=(cur[x]+b)&255
                  elif f==3: cur[x]=(cur[x]+((a+b)//2))&255
                  elif f==4: cur[x]=(cur[x]+paeth(a,b,c))&255
                  elif f!=0: raise SystemExit(f"unsupported PNG filter {f}")
              rows.append(cur); prev=cur
          yellow=orange=0
          for row in rows:
              for x in range(0,len(row),4):
                  r,g,b,a=row[x:x+4]
                  if a>180 and r>190 and g>150 and b<100:
                      yellow += 1
                  if a>120 and r>190 and 55<g<180 and b<90:
                      orange += 1
          print(f"visual cursor candidates: yellow={yellow} orange={orange}")
          if yellow < 8 and orange < 20:
              raise SystemExit("cursor test failed: no visible yellow/orange cursor pixels in screenshot")
          PY

      - name: Upload EARAM cursor test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Earam-Cursor-Test-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/earam-smoke/
            /tmp/earam-emulator.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload EARAM smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Earam-Smoke-Logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/earam-smoke/
            /tmp/earam-emulator.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify .tab intent association on Android 15 emulator
        run: |
          set -euo pipefail

          # Do not launch a synthetic URI. That test is invalid without a real
          # provider and can make adb close even when the manifest is correct.
          # Validate the built APK manifest and verify PackageManager resolution
          # using the MIME-based association that file providers can actually supply.
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          BADGING="$("$AAPT2" dump badging "$APK_PATH")"
          grep -q "package: name='com.earam.tabs'" <<< "$BADGING"

          MANIFEST="$(mktemp)"
          trap 'rm -f "$MANIFEST"' EXIT
          "$AAPT2" dump xmltree "$APK_PATH" --file AndroidManifest.xml > "$MANIFEST"
          cat "$MANIFEST"

          # MainActivity must be exported and expose VIEW + DEFAULT.
          grep -q 'E: activity' "$MANIFEST"
          grep -q 'com.earam.tabs.MainActivity' "$MANIFEST"
          grep -q 'android:exported' "$MANIFEST"
          grep -q 'android.intent.action.VIEW' "$MANIFEST"
          grep -q 'android.intent.category.DEFAULT' "$MANIFEST"

          # The built APK must contain both explicit .tab path registrations
          # and the two MIME registrations.
          grep -q 'android:pathSuffix' "$MANIFEST"
          grep -q '".tab"' "$MANIFEST"
          grep -q 'application/x-earam-tab' "$MANIFEST"
          grep -q 'application/octet-stream' "$MANIFEST"

          # The final signed APK manifest is authoritative for the exact
          # .tab registrations. Installation itself was already verified by the
          # preceding clean Android 15 install-test step (including pm path).
          # Do not issue another ADB/PackageManager query here: the headless
          # emulator can close the ADB transport after repeated shell calls,
          # creating a false failure after every APK check has passed.

          # Resolution-specific shell queries are intentionally omitted. The
          # exact .tab file/content pathSuffix filters and MIME filters above
          # were decoded from the final signed APK itself.

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${VERSION_NAME}"
          SHA_FILE="$APK_PATH.sha256"
          sha256sum "$APK_PATH" > "$SHA_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH#Earam.apk" "$SHA_FILE#Earam.apk.sha256" --clobber
          else
            gh release create "$TAG" "$APK_PATH#Earam.apk" "$SHA_FILE#Earam.apk.sha256" --title "Earam ${VERSION_NAME}" --notes "Earam Android release ${VERSION_NAME}. GitHub Actions run #${{ github.run_number }}."
          fi

      - name: Final SHA-256
        run: sha256sum "$APK_PATH"

      - name: Cleanup Android emulator
        if: always()
        run: |
          set +e
          adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
          pkill -f 'emulator.*-avd earam_api35' >/dev/null 2>&1 || true
          adb kill-server >/dev/null 2>&1 || true

      - name: Cleanup signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/earam-release.keystore.p12"
