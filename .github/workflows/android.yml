name: EARAM Tabs Android
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle :core:test
      - name: Build debug APK
        run: gradle :app:assembleDebug -Pandroid.injected.build.api=35
      - name: Locate debug APK
        run: |
          set -e
          echo "=== APK SEARCH UNDER APP BUILD ==="
          find -L app/build -type f \( -name '*.apk' -o -name '*.apks' \) -print | sort || true
          echo "=== APK SEARCH UNDER WORKSPACE ==="
          find -L . -type f \( -name '*.apk' -o -name '*.apks' \) -print | sort || true
          APK_CANDIDATES=$(find -L app/build -type f -name '*.apk' -print)
          if [ -z "$APK_CANDIDATES" ]; then
            APK_CANDIDATES=$(find -L . -type f -name '*.apk' -print)
          fi
          if [ -z "$APK_CANDIDATES" ]; then
            echo "ERROR: Gradle assembleDebug succeeded but no APK file exists anywhere in the workspace."
            echo "=== APP BUILD TREE ==="
            find -L app/build -maxdepth 8 -print | sort | head -n 500
            exit 1
          fi
          APK=$(printf '%s\n' "$APK_CANDIDATES" | head -n 1)
          echo "Selected APK: $APK"
          mkdir -p /tmp/earam-sign
          cp "$APK" /tmp/earam-sign/original-unsigned.apk
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
      - name: Re-sign APK with generated test key
        run: |
          set -e
          mkdir -p /tmp/earam-sign
          APK="$APK_PATH"
          ORIGINAL_SIZE=$(stat -c '%s' "$APK")
          echo "=== ORIGINAL APK ==="
          echo "Path: $APK"
          echo "Size: $ORIGINAL_SIZE bytes"
          ls -lh "$APK"
          keytool -genkeypair -keystore /tmp/earam-sign/earam.jks -alias earam -keyalg RSA -keysize 2048 -validity 10000 -storepass earamtest123 -keypass earamtest123 -dname "CN=EARAM Test,O=EARAM,C=EG"
          zipalign -p -f 4 "$APK" /tmp/earam-sign/aligned.apk
          echo "=== ZIPALIGN OUTPUT ==="
          stat -c 'Aligned size: %s bytes' /tmp/earam-sign/aligned.apk
          unzip -t /tmp/earam-sign/aligned.apk
          apksigner sign \
            --ks /tmp/earam-sign/earam.jks \
            --ks-key-alias earam \
            --ks-pass pass:earamtest123 \
            --key-pass pass:earamtest123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --out "$APK" \
            /tmp/earam-sign/aligned.apk
          echo "=== FINAL SIZE COMPARISON ==="
          FINAL_SIZE=$(stat -c '%s' "$APK")
          echo "Original: $ORIGINAL_SIZE bytes"
          echo "Final:    $FINAL_SIZE bytes"
          if [ "$FINAL_SIZE" -lt 1000000 ]; then
            echo "ERROR: Final APK is suspiciously small."
            exit 1
          fi
          echo "Size delta: $((FINAL_SIZE - ORIGINAL_SIZE)) bytes"
      - name: Verify final APK integrity and signature
        run: |
          set -e
          APK="$APK_PATH"
          echo "=== FINAL APK FILE ==="
          stat -c 'Final size: %s bytes' "$APK"
          ls -lh "$APK"
          echo "=== ZIP INTEGRITY ==="
          unzip -t "$APK"
          echo "=== APK SIGNATURE VERIFICATION ==="
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs -v "$APK"
          echo "=== FINAL APK SHA256 ==="
          sha256sum "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EARAM-Tabs-debug-apk
          path: "${{ env.APK_PATH }}"
          if-no-files-found: error
