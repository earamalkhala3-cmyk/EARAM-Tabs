name: EARAM Debug Diagnostics
run-name: EARAM Debug Diagnostics — experimental #${{ github.run_number }}

on:
  push:
    branches:
      - feature/unified-selection

permissions:
  contents: read

jobs:
  debug:
    name: Build and verify Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set monotonic Debug version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="0.2-debug.${GITHUB_RUN_NUMBER}"
          echo "EARAM_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "EARAM_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Debug versionCode=$VERSION_CODE"
          echo "Debug versionName=$VERSION_NAME"
          test "$VERSION_CODE" -gt 100004

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run core unit tests and build Debug only
        run: gradle :core:test :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK version, package, and Debug certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "name='com.earam.tabs.debug'"
          APK_VERSION_CODE="$(echo "$BADGING" | sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p")"
          test -n "$APK_VERSION_CODE"
          test "$APK_VERSION_CODE" -eq "$EARAM_VERSION_CODE"
          test "$APK_VERSION_CODE" -gt 100004
          CERT_LINE="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | grep -i 'certificate SHA-256 digest:' | head -n 1)"
          ACTUAL_CERT="$(echo "$CERT_LINE" | awk -F': ' '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT="16345630c8ce937276e76359adeff9bc02c2bd0318cf3f55ec86f23a7d40a712"
          echo "Debug certificate SHA-256=$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          echo "APK versionCode=$APK_VERSION_CODE" > debug-build-verification.txt
          echo "APK package=com.earam.tabs.debug" >> debug-build-verification.txt
          echo "Debug certificate SHA-256=$ACTUAL_CERT" >> debug-build-verification.txt
          echo "Commit=$GITHUB_SHA" >> debug-build-verification.txt
          git rev-parse HEAD >> debug-build-verification.txt

      - name: Upload Debug APK artifact only
        uses: actions/upload-artifact@v4
        with:
          name: Earam-Debug-Diagnostics-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            debug-build-verification.txt
          if-no-files-found: error
          retention-days: 14
