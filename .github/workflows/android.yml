name: EARAM Tabs Android
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle :core:test
      - name: Build debug APK
        run: gradle :app:assembleDebug -Pandroid.injected.build.api=35
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EARAM-Tabs-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
