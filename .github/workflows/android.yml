name: EARAM Tabs Android
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Require persistent release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_B64_1: ${{ secrets.ANDROID_KEYSTORE_B64_1 }}
          ANDROID_KEYSTORE_B64_2: ${{ secrets.ANDROID_KEYSTORE_B64_2 }}
          ANDROID_KEYSTORE_B64_3: ${{ secrets.ANDROID_KEYSTORE_B64_3 }}
          ANDROID_KEYSTORE_B64_4: ${{ secrets.ANDROID_KEYSTORE_B64_4 }}
          ANDROID_KEYSTORE_B64_5: ${{ secrets.ANDROID_KEYSTORE_B64_5 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: earam_release
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64}" || { echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "${ANDROID_KEYSTORE_PASSWORD}" || { echo "ERROR: ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "${ANDROID_KEY_PASSWORD}" || { echo "ERROR: ANDROID_KEY_PASSWORD is missing"; exit 1; }

      - name: Decode persistent release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_B64_1: ${{ secrets.ANDROID_KEYSTORE_B64_1 }}
          ANDROID_KEYSTORE_B64_2: ${{ secrets.ANDROID_KEYSTORE_B64_2 }}
          ANDROID_KEYSTORE_B64_3: ${{ secrets.ANDROID_KEYSTORE_B64_3 }}
          ANDROID_KEYSTORE_B64_4: ${{ secrets.ANDROID_KEYSTORE_B64_4 }}
          ANDROID_KEYSTORE_B64_5: ${{ secrets.ANDROID_KEYSTORE_B64_5 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${RUNNER_TEMP}/earam-release.keystore.p12"
          # Use the canonical full Base64 secret to avoid split-secret concatenation errors.
          CLEAN_BASE64="${ANDROID_KEYSTORE_BASE64}"
          CLEAN_BASE64="$(printf '%s' "${CLEAN_BASE64}" | tr -cd 'A-Za-z0-9+/=')"
          test -n "${CLEAN_BASE64}"
          # Preserve terminal padding from the final split secret; never strip "=" before decoding.
          case $(( ${#CLEAN_BASE64} % 4 )) in
            0) ;;
            2) CLEAN_BASE64="${CLEAN_BASE64}==" ;;
            3) CLEAN_BASE64="${CLEAN_BASE64}=" ;;
            1) echo "ERROR: Base64 secret has an invalid length; it is likely truncated."; exit 1 ;;
          esac
          printf '%s' "${CLEAN_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          test -s "${KEYSTORE_PATH}"
          openssl pkcs12 -in "${KEYSTORE_PATH}" -passin "env:ANDROID_KEYSTORE_PASSWORD" -info -noout >/dev/null
          chmod 600 "${KEYSTORE_PATH}"
          echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_PATH}" >> "${GITHUB_ENV}"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle :core:test --no-daemon --stacktrace

      - name: Build clean release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: earam_release
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:clean :app:assembleRelease -Pandroid.injected.build.api=35 --no-daemon --stacktrace

      - name: Locate APK
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find "$GITHUB_WORKSPACE" -type f -name '*.apk' -print)
          printf '%s\n' "${APKS[@]}"
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one APK, found ${#APKS[@]}"
            find "$GITHUB_WORKSPACE/app/build" -maxdepth 8 -type f -print 2>/dev/null || true
            exit 1
          fi
          APK="${APKS[0]}"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          stat -c 'APK size: %s bytes' "$APK"
          file "$APK"

      - name: Verify release signature and certificate
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_PATH" | tee /tmp/apksigner.txt
          grep -q "Verified using v2 scheme" /tmp/apksigner.txt
          grep -q "Verified using v3 scheme" /tmp/apksigner.txt
          if grep -q "Android Debug" /tmp/apksigner.txt; then
            echo "ERROR: Debug certificate detected in release APK."
            exit 1
          fi

      - name: Verify manifest is installable release
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK_PATH" > /tmp/manifest.txt
          BADGING="$("$AAPT2" dump badging "$APK_PATH")"
          printf '%s\n' "$BADGING"
          if grep -q "testOnly='true'" <<< "$BADGING"; then
            echo "ERROR: testOnly=true found in release APK."
            exit 1
          fi
          if grep -q "debuggable='true'" <<< "$BADGING"; then
            echo "ERROR: debuggable=true found in release APK."
            exit 1
          fi
          grep -E "package: name='com.earam.tabs' versionCode='2' versionName='0.1.1'" <<< "$BADGING"

      - name: Verify APK integrity and zip alignment
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK_PATH"
          unzip -t "$APK_PATH"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_PATH"

      - name: Verify native libraries and 16 KB compatibility
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK_PATH"

          echo "=== NATIVE LIBRARY ZIP PACKAGING ==="
          mapfile -t SO_ENTRIES < <(unzip -Z1 "$APK_PATH" | grep -E '^lib/[^/]+/[^/]+\.so$' || true)
          if [ "${#SO_ENTRIES[@]}" -eq 0 ]; then
            echo "ERROR: Expected native libraries, but APK contains none."
            exit 1
          fi

          unzip -lv "$APK_PATH" | awk '
            $NF ~ /^lib\/[^/]+\/[^/]+\.so$/ {
              if ($2 != "Stored") { print "ERROR: native library is compressed:", $0; bad=1 }
              else { print "OK: native library is uncompressed:", $0 }
            }
            END { exit bad }
          '

          echo "=== ABI COVERAGE ==="
          rm -rf /tmp/earam-unpacked
          mkdir -p /tmp/earam-unpacked
          unzip -o "$APK_PATH" 'lib/*/*.so' -d /tmp/earam-unpacked >/dev/null
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            test -d "/tmp/earam-unpacked/lib/$ABI" || { echo "ERROR: missing ABI directory: $ABI"; exit 1; }
            echo "OK: $ABI present"
          done

          echo "=== ELF LOAD SEGMENTS ==="
          NDK_READELF="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          find /tmp/earam-unpacked/lib -type f -name '*.so' -print0 | while IFS= read -r -d '' SO; do
            echo "--- $SO ---"
            LOADS="$("$NDK_READELF" -lW "$SO" | awk '$1 == "LOAD" {print $NF}')"
            test -n "$LOADS" || { echo "ERROR: no ELF LOAD segments found: $SO"; exit 1; }
            printf 'LOAD alignment: %s\n' "$LOADS"
            while IFS= read -r ALIGN; do
              case "$ALIGN" in
                0x[0-9a-fA-F]*)
                  VALUE=$((ALIGN))
                  if [ "$VALUE" -lt 16384 ] || [ $((VALUE % 16384)) -ne 0 ]; then
                    echo "ERROR: ELF LOAD alignment is below 16 KB or not a 16 KB multiple: $SO ($ALIGN)"
                    exit 1
                  fi
                  ;;
                *) echo "ERROR: could not parse ELF LOAD alignment: $SO ($ALIGN)"; exit 1 ;;
              esac
            done <<< "$LOADS"
          done

      - name: Install-test release APK on Android 15 emulator
        id: emulator_test
        timeout-minutes: 20
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
          ANDROID_EMULATOR_HOME: ${{ runner.temp }}/android-emulator
        run: |
          set -euo pipefail
          LOG=/tmp/earam-emulator.log
          : > "$LOG"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_EMULATOR_HOME"
          sdkmanager "system-images;android-35;google_apis;x86_64" "emulator" "platform-tools" >>"$LOG" 2>&1
          AVD_CREATE_LOG=/tmp/earam-avd-create.log
          if ! echo "no" | avdmanager create avd --force --name earam_api35 --package "system-images;android-35;google_apis;x86_64" >>"$AVD_CREATE_LOG" 2>&1; then
            cat "$AVD_CREATE_LOG"
            echo "ERROR: avdmanager failed to create earam_api35"
            exit 1
          fi
          test -f "$ANDROID_AVD_HOME/earam_api35.ini" || test -f "$ANDROID_AVD_HOME/earam_api35.avd/config.ini" || {
            echo "ERROR: earam_api35 AVD was not created correctly"
            find "$ANDROID_AVD_HOME" -maxdepth 3 -type f -print || true
            cat "$AVD_CREATE_LOG" || true
            exit 1
          }
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          adb kill-server >/dev/null 2>&1 || true
          adb start-server
          nohup "$EMULATOR" -avd earam_api35 -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -accel off -gpu swiftshader_indirect >>"$LOG" 2>&1 &
          EMULATOR_PID=$!
          trap 'adb -s emulator-5554 emu kill >/dev/null 2>&1 || true; kill "$EMULATOR_PID" >/dev/null 2>&1 || true; echo "=== emulator log ==="; tail -n 250 "$LOG" || true' EXIT
          READY=0
          for i in $(seq 1 150); do
            adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            STATE="$(adb -s emulator-5554 get-state 2>/dev/null || true)"
            printf "Waiting for emulator ADB (%s/150)\\n" "$i"
            if [ "$STATE" = "device" ]; then
              READY=1
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "ERROR: emulator process exited before becoming available"
              tail -n 250 "$LOG" || true
              exit 1
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "ERROR: emulator did not become available through adb on port 5555 (serial emulator-5554)"
            adb devices -l || true
            tail -n 250 "$LOG" || true
            exit 1
          fi
          READY=0
          for i in $(seq 1 150); do
            BOOTED="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$BOOTED" = "1" ]; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Android 15 emulator did not finish booting."
            adb devices -l || true
            adb shell getprop || true
            exit 1
          fi
          adb -s emulator-5554 install --no-incremental "$APK_PATH" || {
            echo "ERROR: APK install failed"
            adb -s emulator-5554 shell pm get-install-location || true
            adb -s emulator-5554 logcat -d -t 500 || true
            exit 1
          }
          adb -s emulator-5554 shell pm path com.earam.tabs
          adb -s emulator-5554 shell am force-stop com.earam.tabs
          adb -s emulator-5554 shell monkey -p com.earam.tabs 1 || true
          sleep 3
          adb -s emulator-5554 shell pidof com.earam.tabs || true
          adb -s emulator-5554 install -r --no-incremental "$APK_PATH" || {
            echo "ERROR: APK upgrade install failed"
            adb -s emulator-5554 logcat -d -t 500 || true
            exit 1
          }
          echo "Android 15 emulator clean-install and same-signer upgrade test: PASS"
      - name: Upload release APK
        if: ${{ always() && env.APK_PATH != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: EARAM-Tabs-release-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
      - name: Final APK fingerprint
        run: |
          set -euo pipefail
          sha256sum "$APK_PATH"

      - name: Verify final APK has no debug/test-only markers
        run: |
          set -euo pipefail
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK_PATH")"
          if grep -E "testOnly='true'|debuggable='true'" <<< "$BADGING"; then
            echo "ERROR: debug/test-only marker present"
            exit 1
          fi

      - name: Remove signing material
        if: always()
        run: rm -f "${RUNNER_TEMP}/earam-release.keystore.p12"
