name: EARAM Tabs Android
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create CI release signing key
        run: |
          set -euo pipefail
          rm -f app/release.keystore
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -v -keystore app/release.keystore -storepass "$PASS" -keypass "$PASS" -alias earam-release -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=EARAM Tabs Release, OU=EARAM, O=EARAM, L=Cairo, ST=Cairo, C=EG"
          {
            echo "ANDROID_KEYSTORE_PASSWORD=$PASS"
            echo "ANDROID_KEY_ALIAS=earam-release"
            echo "ANDROID_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"
          chmod 600 app/release.keystore

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle :core:test --no-daemon --stacktrace

      - name: Build clean release APK
        run: gradle :app:clean :app:assembleRelease -Pandroid.injected.build.api=35 --no-daemon --stacktrace

      - name: Locate APK
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find "$GITHUB_WORKSPACE" -type f -name '*.apk' -print)
          printf '%s\n' "${APKS[@]}"
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one APK, found ${#APKS[@]}"
            find "$GITHUB_WORKSPACE/app/build" -maxdepth 8 -type f -print 2>/dev/null || true
            exit 1
          fi
          APK="${APKS[0]}"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          stat -c 'APK size: %s bytes' "$APK"
          file "$APK"

      - name: Verify release signature and certificate
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_PATH" | tee /tmp/apksigner.txt
          grep -q "Verified using v2 scheme" /tmp/apksigner.txt
          grep -q "Verified using v3 scheme" /tmp/apksigner.txt
          if grep -q "Android Debug" /tmp/apksigner.txt; then
            echo "ERROR: Debug certificate detected in release APK."
            exit 1
          fi

      - name: Verify manifest is installable release
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK_PATH" > /tmp/manifest.txt
          BADGING="$("$AAPT2" dump badging "$APK_PATH")"
          printf '%s
' "$BADGING"
          if grep -q "testOnly='true'" <<< "$BADGING"; then
            echo "ERROR: testOnly=true found in release APK."
            exit 1
          fi
          if grep -q "debuggable='true'" <<< "$BADGING"; then
            echo "ERROR: debuggable=true found in release APK."
            exit 1
          fi
          grep -E "package: name='com.earam.tabs' versionCode='2' versionName='0.1.1'" <<< "$BADGING"

      - name: Verify APK integrity and zip alignment
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK_PATH"
          unzip -t "$APK_PATH"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_PATH"

      - name: Verify native libraries and 16 KB compatibility
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK_PATH"

          echo "=== NATIVE LIBRARY ZIP PACKAGING ==="
          mapfile -t SO_ENTRIES < <(unzip -Z1 "$APK_PATH" | grep -E '^lib/[^/]+/[^/]+\.so$' || true)
          if [ "${#SO_ENTRIES[@]}" -eq 0 ]; then
            echo "ERROR: Expected native libraries, but APK contains none."
            exit 1
          fi

          unzip -lv "$APK_PATH" | awk '
            $NF ~ /^lib\/[^/]+\/[^/]+\.so$/ {
              if ($2 != "Stored") { print "ERROR: native library is compressed:", $0; bad=1 }
              else { print "OK: native library is uncompressed:", $0 }
            }
            END { exit bad }
          '

          echo "=== ABI COVERAGE ==="
          rm -rf /tmp/earam-unpacked
          mkdir -p /tmp/earam-unpacked
          unzip -o "$APK_PATH" 'lib/*/*.so' -d /tmp/earam-unpacked >/dev/null
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            test -d "/tmp/earam-unpacked/lib/$ABI" || { echo "ERROR: missing ABI directory: $ABI"; exit 1; }
            echo "OK: $ABI present"
          done

          echo "=== ELF LOAD SEGMENTS ==="
          NDK_READELF="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          find /tmp/earam-unpacked/lib -type f -name '*.so' -print0 | while IFS= read -r -d '' SO; do
            echo "--- $SO ---"
            LOADS="$("$NDK_READELF" -lW "$SO" | awk '$1 == "LOAD" {print $NF}')"
            test -n "$LOADS" || { echo "ERROR: no ELF LOAD segments found: $SO"; exit 1; }
            printf 'LOAD alignment: %s\n' $LOADS
            while IFS= read -r ALIGN; do
              case "$ALIGN" in
                0x[0-9a-fA-F]*)
                  VALUE=$((ALIGN))
                  if [ "$VALUE" -lt 16384 ] || [ $((VALUE % 16384)) -ne 0 ]; then
                    echo "ERROR: ELF LOAD alignment is below 16 KB or not a 16 KB multiple: $SO ($ALIGN)"
                    exit 1
                  fi
                  ;;
                *) echo "ERROR: could not parse ELF LOAD alignment: $SO ($ALIGN)"; exit 1 ;;
              esac
            done <<< "$LOADS"
          done

      - name: Final APK fingerprint
        run: |
          set -euo pipefail
          sha256sum "$APK_PATH"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: EARAM-Tabs-release-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Verify final APK has no debug/test-only markers
        run: |
          set -euo pipefail
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK_PATH")"
          if grep -E "testOnly='true'|debuggable='true'" <<< "$BADGING"; then
            echo "ERROR: debug/test-only marker present"
            exit 1
          fi

      - name: Remove signing material
        if: always()
        run: rm -f app/release.keystore
