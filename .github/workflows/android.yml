name: EARAM Tabs Android
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply Kotlin compile fixes
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          p = Path("app/src/main/java/com/earam/tabs/MainActivity.kt")
          s = p.read_text()
          old = "timeSig.substringBefore('/').toIntOrNull().coerceAtLeast(1)"
          new = "(timeSig.substringBefore('/').toIntOrNull() ?: 1).coerceAtLeast(1)"
          s = s.replace(old, new)
          s = s.replace("val cursorX = gridX + (cursor.first + cursor.second) * cellWidth", "val cursorX = (gridX + (cursor.first + cursor.second) * cellWidth).toFloat()")
          p.write_text(s)
          PY2
      - name: Run unit tests
        run: gradle :core:test
      - name: Build debug APK
        run: gradle :app:assembleDebug -Pandroid.injected.build.api=35
      - name: Locate APK
        run: |
          set -e
          mapfile -t APKS < <(find app/build -type f -name '*.apk' -print)
          printf '%s\n' "${APKS[@]}"
          APK=""
          for candidate in "${APKS[@]}"; do
            if [[ "$(basename "$candidate")" == *debug*.apk ]]; then
              APK="$candidate"
              break
            fi
          done
          if [[ -z "$APK" ]]; then
            echo "No debug APK found. All APK candidates:" >&2
            printf '%s\n' "${APKS[@]}" >&2
            exit 1
          fi
          echo "Selected APK: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
      - name: Re-sign APK with generated test key
        run: |
          set -e
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p /tmp/earam-sign
          keytool -genkeypair -keystore /tmp/earam-sign/earam.jks -alias earam -keyalg RSA -keysize 2048 -validity 10000 -storepass earamtest123 -keypass earamtest123 -dname "CN=EARAM Test,O=EARAM,C=EG"
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 "$APK_PATH" /tmp/earam-sign/aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/earam-sign/earam.jks \
            --ks-key-alias earam \
            --ks-pass pass:earamtest123 \
            --key-pass pass:earamtest123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$APK_PATH" \
            /tmp/earam-sign/aligned.apk
      - name: Verify final APK
        run: |
          set -e
          APK="$APK_PATH"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          ls -lh "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EARAM-Tabs-debug-apk
          path: "${{ env.APK_PATH }}"
          if-no-files-found: error
