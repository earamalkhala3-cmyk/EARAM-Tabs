name: EARAM Tabs Android
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle :core:test
      - name: Build clean debug APK
        run: gradle :app:clean :app:assembleDebug -Pandroid.injected.build.api=35 --no-daemon
      - name: Locate APK
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find "$GITHUB_WORKSPACE" -type f -name '*.apk' -print)
          printf '%s
' "${APKS[@]}"
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one APK, found ${#APKS[@]}"
            find "$GITHUB_WORKSPACE/app/build" -maxdepth 8 -type f -print 2>/dev/null || true
            exit 1
          fi
          APK="${APKS[0]}"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          stat -c 'APK size: %s bytes' "$APK"
          file "$APK"
      - name: Verify build-signed APK
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK_PATH"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_PATH"
      - name: Verify manifest and package metadata
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          "$AAPT2" dump badging "$APK_PATH"
          "$AAPT2" dump badging "$APK_PATH" | grep -E "package: name='com.earam.tabs' versionCode='2' versionName='0.1.1'"
      - name: Verify APK integrity
        run: |
          set -euo pipefail
          unzip -t "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"
      - name: Verify APK native libraries and 16 KB compatibility
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK_PATH"

          echo "=== NATIVE LIBRARY ZIP PACKAGING ==="
          mapfile -t SO_ENTRIES < <(unzip -Z1 "$APK_PATH" | grep -E '^lib/[^/]+/[^/]+\.so$' || true)
          if [ "${#SO_ENTRIES[@]}" -eq 0 ]; then
            echo "ERROR: Expected native libraries, but APK contains none."
            exit 1
          fi

          unzip -lv "$APK_PATH" | awk '
            $NF ~ /^lib\/[^/]+\/[^/]+\.so$/ {
              if ($2 != "Stored") {
                print "ERROR: native library is compressed:", $0
                bad=1
              } else {
                print "OK: native library is uncompressed:", $0
              }
            }
            END { exit bad }
          '

          echo "=== ABI COVERAGE ==="
          rm -rf /tmp/earam-unpacked
          mkdir -p /tmp/earam-unpacked
          unzip -o "$APK_PATH" 'lib/*/*.so' -d /tmp/earam-unpacked >/dev/null

          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            if [ ! -d "/tmp/earam-unpacked/lib/$ABI" ]; then
              echo "ERROR: missing ABI directory: $ABI"
              exit 1
            fi
            echo "OK: $ABI present"
          done

          echo "=== ELF LOAD SEGMENTS ==="
          NDK_READELF="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          find /tmp/earam-unpacked/lib -type f -name '*.so' -print0 | while IFS= read -r -d '' SO; do
            echo "--- $SO ---"
            LOADS="$("$NDK_READELF" -lW "$SO" | awk '$1 == "LOAD" {print}')"
            if [ -z "$LOADS" ]; then
              echo "ERROR: no ELF LOAD segments found: $SO"
              exit 1
            fi
            printf '%s
' "$LOADS"
            if printf '%s
' "$LOADS" | awk '$NF !~ /^0x4000$/ && $NF !~ /^0x[89a-fA-F][0-9a-fA-F]*$/ {bad=1} END {exit bad}'; then
              :
            else
              echo "ERROR: native library has an ELF LOAD alignment below 16 KB: $SO"
              exit 1
            fi
          done

      - name: Verify APK contains no unaligned native packaging
        run: |
          set -euo pipefail
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK_PATH"
          if unzip -lv "$APK_PATH" | awk '$NF ~ /^lib\/[^/]+\/[^/]+\.so$/ && $2 != "Stored" { bad=1 } END { exit bad }'; then
            echo "All native libraries are stored uncompressed and APK page-aligned."
          else
            echo "ERROR: one or more native libraries are compressed."
            exit 1
          fi

      - name: Final APK fingerprint
        run: sha256sum "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EARAM-Tabs-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
