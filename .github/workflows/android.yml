name: EARAM Tabs Android
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply Kotlin compile fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/earam/tabs/MainActivity.kt")
          s = p.read_text()
          old = "timeSig.substringBefore('/').toIntOrNull().coerceAtLeast(1)"
          new = "(timeSig.substringBefore('/').toIntOrNull() ?: 1).coerceAtLeast(1)"
          s = s.replace(old, new)
          s = s.replace("val cursorX = gridX + (cursor.first + cursor.second) * cellWidth", "val cursorX = (gridX + (cursor.first + cursor.second) * cellWidth).toFloat()")
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/earam/tabs/MainActivity.kt
          git diff --cached --quiet || git commit -m "Fix Kotlin editor compile type errors"
          git push
      - name: Run unit tests
        run: gradle :core:test
      - name: Build debug APK
        run: gradle :app:assembleDebug -Pandroid.injected.build.api=35
      - name: Locate APK
        run: |
          find . -type f -name "*.apk" -print
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EARAM-Tabs-debug-apk
          path: "**/*.apk"
          if-no-files-found: error
