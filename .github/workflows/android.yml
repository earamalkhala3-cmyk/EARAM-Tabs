name: EARAM Tabs Android
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle :core:test
      - name: Build clean debug APK
        run: gradle :app:assembleDebug -Pandroid.injected.build.api=35 --no-daemon
      - name: Locate APK
        run: |
          set -euo pipefail
          echo "=== APK FILES ==="
          mapfile -t APKS < <(find "$GITHUB_WORKSPACE" -type f -name '*.apk' -print)
          printf '%s\n' "${APKS[@]}"
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one APK, found ${#APKS[@]}"
            echo "=== BUILD OUTPUT TREE ==="
            find "$GITHUB_WORKSPACE/app/build" -maxdepth 8 -type f -print 2>/dev/null || true
            exit 1
          fi
          APK="${APKS[0]}"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          stat -c 'APK size: %s bytes' "$APK"
          file "$APK"
      - name: Force final 16 KB alignment, then re-sign APK
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          ALIGNED_APK="$RUNNER_TEMP/app-debug-aligned.apk"
          FINAL_APK="$RUNNER_TEMP/app-debug-final.apk"

          echo "=== ALIGN APK BEFORE FINAL SIGNING ==="
          "$BUILD_TOOLS/zipalign" -f -P 16 -v 4 "$APK_PATH" "$ALIGNED_APK"

          echo "=== RE-SIGN ALIGNED APK WITH DEBUG KEY ==="
          "$BUILD_TOOLS/apksigner" sign             --ks "$HOME/.android/debug.keystore"             --ks-pass pass:android             --key-pass pass:android             --out "$FINAL_APK"             "$ALIGNED_APK"

          cp "$FINAL_APK" "$APK_PATH"

          echo "=== VERIFY FINAL APK ==="
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK_PATH"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_PATH"
      - name: Verify manifest and package metadata
        run: |
          set -e
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$AAPT2"
          echo "=== BADGING ==="
          "$AAPT2" dump badging "$APK_PATH"
          echo "=== MANIFEST PACKAGE ==="
          "$AAPT2" dump badging "$APK_PATH" | grep -E "package: name='com.earam.tabs' versionCode='2' versionName='0.1.1'"
      - name: Verify APK integrity and signature
        run: |
          set -e
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          echo "=== ZIP INTEGRITY ==="
          unzip -t "$APK_PATH"
          echo "=== APK SIGNATURE ==="
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_PATH"
      - name: Verify 16 KB native libraries
        run: |
          set -e
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          echo "=== ZIPALIGN CHECK ==="
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK_PATH"
          echo "=== NATIVE LIBRARY ZIP PACKAGING ==="
          if unzip -lv "$APK_PATH" | awk '$4 ~ /lib\/.*\.so$/ && $1 != 0 {bad=1; print "ERROR: native library is compressed:", $0} END {exit bad}'; then :; else exit 1; fi
          echo "=== ELF LOAD SEGMENTS ==="
          rm -rf /tmp/earam-unpacked
          mkdir -p /tmp/earam-unpacked
          unzip -o "$APK_PATH" 'lib/*/*.so' -d /tmp/earam-unpacked >/dev/null
          NDK_OBJDUMP="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          find /tmp/earam-unpacked/lib -name '*.so' -print0 | while IFS= read -r -d '' SO; do
            echo "--- $SO ---"
            "$NDK_OBJDUMP" -p "$SO" | grep LOAD
            if "$NDK_OBJDUMP" -p "$SO" | grep LOAD | grep -v 'align 2\*\*14' >/dev/null; then
              echo "ERROR: native library is not fully 16 KB ELF aligned: $SO"
              exit 1
            fi
          done
      - name: Final APK fingerprint
        run: sha256sum "$APK_PATH"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EARAM-Tabs-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
