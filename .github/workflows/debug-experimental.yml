name: EARAM Experimental Debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Test core and build signed Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set explicit experimental Debug version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="0.2-debug.${GITHUB_RUN_NUMBER}"
          echo "EARAM_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "EARAM_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Debug versionCode=$VERSION_CODE"
          echo "Debug versionName=$VERSION_NAME"
          test "$VERSION_CODE" -gt 100004

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run core unit tests and assemble Debug
        run: gradle :core:test :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK package, version, and fixed Debug signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING"
          grep -Fq "name='com.earam.tabs.debug'" <<< "$BADGING"
          APK_VERSION_CODE="$(sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p" <<< "$BADGING")"
          test "$APK_VERSION_CODE" = "$EARAM_VERSION_CODE"
          test "$APK_VERSION_CODE" -gt 100004

          CERT_LINE="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | grep -i 'certificate SHA-256 digest:' | head -n 1)"
          ACTUAL_CERT="$(awk -F': ' '{print $2}' <<< "$CERT_LINE" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT="16345630c8ce937276e76359adeff9bc02c2bd0318cf3f55ec86f23a7d40a712"
          echo "Debug certificate SHA-256=$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"

          {
            echo "Commit=$GITHUB_SHA"
            echo "APK package=com.earam.tabs.debug"
            echo "APK versionCode=$APK_VERSION_CODE"
            echo "APK versionName=$EARAM_VERSION_NAME"
            echo "Debug certificate SHA-256=$ACTUAL_CERT"
          } > debug-build-verification.txt
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload Debug artifacts only
        uses: actions/upload-artifact@v4
        with:
          name: Earam-Debug-Experimental-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            debug-build-verification.txt
          if-no-files-found: error
          retention-days: 14
